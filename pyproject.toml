[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "custom-fabric-shell"
version = "0.0.1"
requires-python = ">= 3.11"
authors = [
{name="Mrid22",email="mridul16381@proton.me"}
]
maintainers = [
{name="Mrid22",email="mridul16381@proton.me"}
]
description = "Making a desktop shell"
dependencies = [
  "fabric @ git+https://github.com/Fabric-Development/fabric.git",
  "pycairo",
  "loguru",
  "pygobject",
  "plyer",
  "stubgen",
]
[tools.mypy]
mypy_path="stubs"
